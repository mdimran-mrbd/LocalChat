name: Build LocalChat binaries

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish Releases on tag pushes

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Compute release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute next version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REPUBLISH=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            git fetch --tags --force >/dev/null 2>&1 || true
            LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
            PACKAGE_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/Cargo.toml | head -n1)"
            if [[ -z "$PACKAGE_VERSION" ]]; then
              echo "Could not read package version from app/Cargo.toml" >&2
              exit 1
            fi
            COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
            if [[ "$COMMIT_SUBJECT" =~ \[republish[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
              TAG="${BASH_REMATCH[1]}"
              REPUBLISH=true
            else
              LATEST_VERSION="${LATEST#v}"
              # Honor an explicitly prepared package version when newer than
              # the latest release tag; otherwise automatically increment patch.
              if [[ -z "$LATEST" ]] || [[ "$PACKAGE_VERSION" != "$LATEST_VERSION" && "$(printf '%s\n' "$LATEST_VERSION" "$PACKAGE_VERSION" | sort -V | tail -n1)" == "$PACKAGE_VERSION" ]]; then
                TAG="v$PACKAGE_VERSION"
              else
                IFS='.' read -r MA MI PA <<< "$LATEST_VERSION"
                TAG="v${MA}.${MI}.$((PA + 1))"
              fi
            fi
          fi
          echo "Selected tag: $TAG"
          echo "republish=$REPUBLISH" >> "$GITHUB_OUTPUT"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Bare semver (no leading 'v') for embedding in the binary.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          BUILD_NUMBER="$(tr -d '[:space:]' < app/BUILD_NUMBER)"
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then echo "Invalid app/BUILD_NUMBER" >&2; exit 1; fi
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) + target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
          workspaces: app

      - name: Build
        shell: bash
        working-directory: app
        env:
          # Stamped into the exe via option_env!() in src/http.rs so
          # /api/info reports the same version as the GitHub release
          # tag, not the stale Cargo.toml value.
          LOCALCHAT_VERSION: ${{ needs.version.outputs.version }}
          LOCALCHAT_BUILD: ${{ needs.version.outputs.build }}
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --features tray

      - name: Collect & size check
        shell: bash
        run: |
          mkdir -p dist
          cp "app/target/x86_64-pc-windows-msvc/release/localchat.exe" "dist/LocalChat.exe"
          ls -la dist
          size=$(wc -c < "dist/LocalChat.exe")
          echo "Binary size: $size bytes"
          # Soft ceiling: 15 MB. Bump if needed, but keep an eye on bloat.
          test "$size" -lt 15728640

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalChat.exe
          path: dist/LocalChat.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Move existing release tag for an intentional documentation rebuild
        if: needs.version.outputs.republish == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "$TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Create SHA-256 checksum
        shell: bash
        run: |
          cd release
          sha256sum LocalChat.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Select release notes
        id: notes
        shell: bash
        run: |
          NOTES="docs/releases/${{ needs.version.outputs.tag }}.md"
          if [[ -f "$NOTES" ]]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: LocalChat ${{ needs.version.outputs.version }} — Build ${{ needs.version.outputs.build }}
          target_commitish: ${{ github.sha }}
          files: release/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generated }}
          draft: false
          prerelease: false
          make_latest: true
