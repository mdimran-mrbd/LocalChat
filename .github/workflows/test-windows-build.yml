name: Build LocalChat test version

on:
  push:
    branches: [feature/message-search]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows test executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build test executable
        working-directory: app
        run: cargo build --release --target x86_64-pc-windows-msvc --features tray
      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: LocalChat-test-Windows
          path: app/target/x86_64-pc-windows-msvc/release/localchat.exe
          if-no-files-found: error
          retention-days: 7
