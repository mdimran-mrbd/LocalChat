name: LocalChat CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localchat-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate LocalChat
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Rust code
        run: cargo check --manifest-path app/Cargo.toml --no-default-features
      - name: Run Rust tests
        run: cargo test --manifest-path app/Cargo.toml --no-default-features
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app/web/app.js

  build-windows:
    name: Build Windows test executable
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build test executable
        working-directory: app
        run: cargo build --release --target x86_64-pc-windows-msvc --features tray
      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: LocalChat-test-Windows
          path: app/target/x86_64-pc-windows-msvc/release/localchat.exe
          if-no-files-found: error
          retention-days: 7
